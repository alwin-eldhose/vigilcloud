[project]
name = "vigilcloud"
version = "1.0.0"
description = "VigilCloud: multi-modal vendor risk and compliance intake"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.41,<2",
    "python-dotenv>=1.0.1",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pypdf>=5.1",
    "anthropic>=2.12.0",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "reportlab>=5.1.0",
]
